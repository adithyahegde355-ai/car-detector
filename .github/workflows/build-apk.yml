name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --project-name car_detector _scaffold
          cp -r _scaffold/android ./android
          rm -rf _scaffold

      - name: Add internet permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Install packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-detector-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
